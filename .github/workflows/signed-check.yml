# End-to-end test of signed results, run on demand and on every release tag.
#
# signed:  Flagwake's signing workflow runs Flagwake's own model agent (its dry mode, no model)
#          and signs the report. Its key comes in as the model-key secret, the way a caller in
#          another account passes one; the run stops if the key does not arrive.
# redteam: the same workflow runs a defender that tries every way it knows to escape its sandbox
#          (.github/redteam/attacker.py): sudo, the job's signing token, the harness's memory,
#          the output folder, the runner's credentials, docker, a process that outlives the run.
#          It is also handed one public value and one secret (secrets: inherit), to show both
#          arrive.
# action:  the GitHub Action runs the same steps inside this workflow.
# control: the same attacker without the sandbox, to show the attacks are real.
# check:   with nothing but the downloaded files: the signatures check out with flagwake verify
#          and with GitHub's own tool, the signer is Flagwake's workflow (or, for the action, this
#          one), the attempt tickets are in the public log, a forged ticket does not count, a
#          changed copy loses its signature, every attack was blocked inside the sandbox, and the
#          attacks worked outside it.
# Each signed run takes an attempt number of this repository in the public log.
name: signed-check

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  signed:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/check.yml
    with:
      agent: reference:model --dry
      seeds: "1"
      name: signed-result
      defender-env: FLAGWAKE_LLM_KEY=model-key
    secrets:
      model-key: flagwake-dry-run-stand-in  # the dry run calls no model, so no real key

  redteam:
    needs: signed  # one attempt at a time, so the attempt numbers are in order
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/check.yml
    with:
      agent: python .github/redteam/attacker.py
      seeds: "1"
      name: redteam-result
      defender-vars: |
        FLAGWAKE_SELFTEST_VAR=1
      defender-env: FLAGWAKE_SELFTEST_SECRET=GITHUB_TOKEN
    secrets: inherit

  action:
    needs: redteam
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: ./
        with:
          agent: python examples/rc_agent.py
          seeds: "1"
          package: .[provenance]

  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # as in a signing job, so the attacker has a signing token to look for
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet .
      - name: The attacker as the harness's own user (no sandbox, nothing signed)
        run: |
          flagwake check --agent "python .github/redteam/attacker.py" --pack practice --seeds 1 --family quiet --out flagwake-result || true
          sleep 6
          if [ "$(cat flagwake-result/report.json)" = "{}" ]; then
            echo "REDTEAM report-rewritten: SUCCEEDED a leftover process replaced report.json" >> flagwake-result/agent-stderr.log
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: control-result
          path: flagwake-result/agent-stderr.log

  check:
    needs: [signed, redteam, action, control]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: results
      - name: Install Flagwake with the signature check
        run: python -m pip install --disable-pip-version-check --quiet ".[provenance]"

      - name: The signed report, its signer, its incidents and its attempt
        run: |
          flagwake verify results/signed-result/report.json --provenance results/signed-result/report.sigstore.json --repo "$GITHUB_REPOSITORY" --attempts | tee signed.txt
          grep -q "harness: Flagwake's signing workflow at" signed.txt
          grep -q "defender: reference:model --dry; ran as a separate user flagwake-defender, without sudo" signed.txt
          grep -q "incidents: drawn in the run; pack fresh" signed.txt
          grep -q "<- this report" signed.txt

      - name: Official only at a release tag
        run: |
          if flagwake verify results/signed-result/report.json --provenance results/signed-result/report.sigstore.json --require-official > official.txt; then ok=yes; else ok=no; fi
          cat official.txt
          case "$GITHUB_REF" in
            refs/tags/v*) [ "$ok" = yes ] ;;
            *) [ "$ok" = no ] && grep -q "not signed by Flagwake's signing workflow at a release" official.txt ;;
          esac

      - name: GitHub's own tool agrees on the report and the signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify results/signed-result/report.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/check.yml" --bundle results/signed-result/report.sigstore.json
          gh attestation verify results/signed-result/attempt-ticket.txt --repo "$GITHUB_REPOSITORY" --bundle results/signed-result/attempt-ticket.sigstore.json

      - name: A forged attempt ticket does not count
        run: python .github/redteam/forged_ticket.py results/signed-result/report.sigstore.json "$GITHUB_REPOSITORY_ID"

      - name: A changed copy keeps its numbers but loses its signature
        run: |
          python - <<'PY'
          import json
          doc = json.load(open("results/signed-result/report.json", encoding="utf-8"))
          open("copy.json", "w", encoding="utf-8").write(json.dumps(doc, indent=1))
          PY
          flagwake verify copy.json
          if flagwake verify copy.json --provenance results/signed-result/report.sigstore.json; then
            echo "a changed file kept its signature"; exit 1
          fi

      - name: Every attack was blocked inside the sandbox
        run: |
          log=results/redteam-result/agent-stderr.log
          grep "^REDTEAM" "$log"
          if grep -q "SUCCEEDED" "$log"; then echo "an attack worked inside the sandbox"; exit 1; fi
          [ "$(grep -c ': blocked$' "$log")" -ge 8 ]
          grep -q "background-process: started" "$log"
          grep -q "REDTEAM-INFO passed-variable: visible" "$log"
          grep -q "REDTEAM-INFO passed-secret: visible" "$log"
          flagwake verify results/redteam-result/report.json --provenance results/redteam-result/report.sigstore.json --repo "$GITHUB_REPOSITORY"

      - name: The action signs as this workflow, and verify says so
        run: |
          flagwake verify results/flagwake-result/report.json --provenance results/flagwake-result/report.sigstore.json --repo "$GITHUB_REPOSITORY" --attempts | tee action.txt
          grep -q "harness: the repository's own workflow" action.txt
          grep -q "ran as a separate user flagwake-defender, without sudo" action.txt
          if flagwake verify results/flagwake-result/report.json --provenance results/flagwake-result/report.sigstore.json --require-official; then
            echo "the action's result passed for an official one"; exit 1
          fi

      - name: The same attacks work outside the sandbox (the attacks are real)
        run: |
          log=results/control-result/agent-stderr.log
          grep "^REDTEAM" "$log"
          for attack in sudo token-in-other-processes output-folder-write report-rewritten; do
            grep -q "REDTEAM $attack: SUCCEEDED" "$log" || { echo "expected $attack to work without the sandbox"; exit 1; }
          done
