# Signed results for models served by GitHub Models (free, rate-limited), each run by
# Flagwake's signing workflow with Flagwake's reference model agent. Every run is published in
# docs/RESULTS.md by scripts/collect_results.py, whatever its result: none is left out.
#
# Run it on a release tag (Run workflow, "Use workflow from": the tag) so the signer is Flagwake's
# workflow at that release; a run on a branch is signed too, but verify reports it as unreleased.
# models: a JSON list of {"id": "<GitHub Models id>", "slug": "<artifact-safe name>"}.
name: results

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'JSON list, e.g. [{"id": "publisher/model-name", "slug": "model-name"}]; [] lists the catalog only'
        default: "[]"
      seeds:
        description: Incidents per family (each model call counts against the daily limit).
        default: "1"
      max-calls:
        description: Model calls per incident at most.
        default: "6"

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      models: read
    steps:
      - name: The models GitHub Models offers today, with their rate-limit tier
        env:
          TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o catalog.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://models.github.ai/catalog/models)
          echo "catalog: HTTP $code, $(wc -c < catalog.json) bytes"
          python - <<'PY'
          import json
          raw = open("catalog.json", encoding="utf-8", errors="replace").read()
          try:
              models = json.loads(raw)
          except ValueError:
              print("not JSON:", raw[:300])
              raise SystemExit(1)
          for m in models:
              print(f"MODEL\t{m.get('id')}\t{m.get('rate_limit_tier')}\t{m.get('publisher')}")
          PY

  model:
    needs: catalog
    if: inputs.models != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1  # one at a time: attempt numbers stay in order
      matrix:
        include: ${{ fromJSON(inputs.models) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      models: read
    uses: ./.github/workflows/check.yml
    with:
      agent: python -m cyberarena.rc.model_agent --max-calls ${{ inputs.max-calls }} --timeout 100
      seeds: ${{ inputs.seeds }}
      step-timeout: "120"
      defender-vars: |
        FLAGWAKE_LLM_BASE_URL=https://models.github.ai/inference
        FLAGWAKE_LLM_MODEL=${{ matrix.id }}
      github-token-as: FLAGWAKE_LLM_KEY
      name: result-${{ matrix.slug }}
